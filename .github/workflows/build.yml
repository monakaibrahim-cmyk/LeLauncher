name: Build & Package Artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug


permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Linux Build Job (Runs on Self-Hosted Debian VPS Runner)
  # ============================================================================
  build-linux:
    name: Build Linux (Self-Hosted Runner)
    runs-on: self-hosted
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Package LeLauncher
        run: |
          chmod +x ./setup.sh
          BUILD_CFG="${{ inputs.build_type || 'Release' }}"
          if [ "$BUILD_CFG" = "Debug" ]; then
            ./setup.sh --clean --debug --package
          else
            ./setup.sh --clean --release --package
          fi

      - name: Upload Linux Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeLauncher-Linux-x86_64
          path: dist/LeLauncher-Linux-*.tar.gz
          retention-days: 14
          if-no-files-found: error

  # ============================================================================
  # 2. Windows Build Job (MSVC 2022 on GitHub-Hosted Windows Runner)
  # ============================================================================
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Export GitHub Actions Cache Environment for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Initialize vcpkg Cache Configuration
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite;files,$cacheDir,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache vcpkg Binary Artifacts (Filesystem Fallback)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install Dependencies via vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet x64-windows

      - name: Configure LeLauncher with CMake (MSVC)
        shell: pwsh
        run: |
          $BUILD_CFG = "${{ inputs.build_type || 'Release' }}"
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=$BUILD_CFG

      - name: Compile LeLauncher with MSVC
        shell: pwsh
        run: |
          $BUILD_CFG = "${{ inputs.build_type || 'Release' }}"
          cmake --build build --config $BUILD_CFG --parallel

      - name: Bundle Standalone Windows Distribution
        shell: pwsh
        run: |
          $BUILD_CFG = "${{ inputs.build_type || 'Release' }}"
          $DIST_DIR = "dist/LeLauncher-Windows-x64"
          if (Test-Path $DIST_DIR) { Remove-Item -Recurse -Force $DIST_DIR }
          New-Item -ItemType Directory -Force -Path $DIST_DIR | Out-Null

          # Copy primary executable
          if (Test-Path "build/$BUILD_CFG/LeLauncher.exe") {
            Copy-Item "build/$BUILD_CFG/LeLauncher.exe" -Destination "$DIST_DIR/"
          } elseif (Test-Path "build/LeLauncher.exe") {
            Copy-Item "build/LeLauncher.exe" -Destination "$DIST_DIR/"
          }

          # Copy runtime game data and manifests
          if (Test-Path "WoW.mfil") {
            Copy-Item "WoW.mfil" -Destination "$DIST_DIR/"
          }
          if (Test-Path "data") {
            Copy-Item -Recurse "data" -Destination "$DIST_DIR/data"
          }
          if (Test-Path "icon.ico") {
            Copy-Item "icon.ico" -Destination "$DIST_DIR/"
          }

          # Bundle all required runtime DLLs from build directory and vcpkg
          Get-ChildItem -Path "build/$BUILD_CFG" -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$DIST_DIR/"
          Get-ChildItem -Path "build" -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$DIST_DIR/"
          Get-ChildItem -Path "vcpkg_installed/x64-windows/bin" -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$DIST_DIR/"
          Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$DIST_DIR/"

          # Bundle GTK 4 schemas (required for GTK4 window initialization on Windows)
          $SCHEMAS_SRC = ""
          if (Test-Path "vcpkg_installed/x64-windows/share/glib-2.0/schemas") {
            $SCHEMAS_SRC = "vcpkg_installed/x64-windows/share/glib-2.0/schemas"
          } elseif (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/glib-2.0/schemas") {
            $SCHEMAS_SRC = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/glib-2.0/schemas"
          }

          if ($SCHEMAS_SRC -ne "") {
            $SCHEMAS_DST = "$DIST_DIR/share/glib-2.0/schemas"
            New-Item -ItemType Directory -Force -Path $SCHEMAS_DST | Out-Null
            Copy-Item -Path "$SCHEMAS_SRC/*" -Destination "$SCHEMAS_DST/" -Force
          }

          # Compress to portable zip distribution
          Compress-Archive -Path "$DIST_DIR/*" -DestinationPath "LeLauncher-Windows-x64.zip" -Force

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeLauncher-Windows-x64
          path: LeLauncher-Windows-x64.zip
          retention-days: 14
          if-no-files-found: error

  # ============================================================================
  # 3. Release Publishing Job (Automatic when a version tag like v1.0.0 is pushed)
  # ============================================================================
  release:
    name: Publish Release (Tags Only)
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: LeLauncher-Linux-x86_64
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LeLauncher-Windows-x64
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/LeLauncher-Linux-*.tar.gz
            release-assets/LeLauncher-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
